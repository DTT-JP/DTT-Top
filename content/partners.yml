# ============================================================
#  相互リンク（リンクを交換している外部サイト）
#  上から順に表示されます。編集したら  npm run build  で HTML を作り直してください。
#
#  name : サイト名（必須）
#  url  : サイトの URL（必須・https:// か http:// で始めること）
#  desc : 一言の説明（任意）
#  icon : Font Awesome のクラス名（任意・省略すると fa-solid fa-link）
#         https://fontawesome.com/icons で Free のアイコンを探してください。
#
#  ※ 相互リンク先は外部サイトなので、全モードで「新しいタブ」で開きます。
# ============================================================

# 相互リンク先の一覧。追加するときは、下のコメントの形で同じ階層に書き足します。
partners:
  - name: meitetuさん
    url: https://meitetu.net/
    icon: fa-solid fa-globe

  # - name: サンプルサイト
  #   url: https://example.com/
  #   desc: サイトの一言紹介
  #   icon: fa-solid fa-globe

# 一覧の下に出す案内文（相互リンクの募集など）。不要なら "" にするか、この項目ごと削除。
partners_note: ""

# 相互リンク先がまだ 0 件のときに出す文章
partners_empty: 相互リンクのサイトは準備中です。
