# ============================================================
#  制作物（作ったものの一覧）
#  icon       : Font Awesome のクラス名（https://fontawesome.com/icons ・Free のみ）
#  tech       : 使っている技術（チップとして並ぶ）
#  background : 作りや背景の説明。通常版では「背景・仕組み」の折りたたみ、
#               レトロ版・ヴィンテージ版では本文にそのまま出ます。
#  links      : ボタン。kind は primary（塗りつぶし）か secondary（枠線）
# ============================================================

works:
  - title: Discord-to-OBS-nicoChat
    icon: fa-solid fa-comments
    desc: Discordのチャットをニコニコ風にOBS上に流すツールです。配信画面をより楽しく、インタラクティブにカスタマイズできます。
    tech: [Node.js, Discord.js]
    background: Node.js と Discord.js で作っています。
    links:
      - label: Open
        url: https://d2obs.dttjp.com/
        kind: primary
      - label: GitHub
        url: https://github.com/DTT-JP/Discord-to-OBS-nicoChat
        kind: secondary
        icon: fa-brands fa-github

  - title: お小遣い帳
    icon: fa-solid fa-wallet
    desc: シンプルで使いやすいオンラインお小遣い帳サービスです。収支を素早く記録し、管理することができます。
    tech: [PHP, Material Design 3]
    background: PHP で作った Web サービスです。画面は Material Design 3 (MD3) のデザインで作っています。
    links:
      - label: Open
        url: https://okodukai.dttjp.com/
        kind: primary

  - title: Melodia
    icon: fa-solid fa-music
    desc: iPadで使用することを想定したローカル音楽再生用WEBアプリです。
    tech: [HTML, CSS, JavaScript]
    background: HTML・CSS・JavaScript で作った、ごく一般的な Web アプリです。特別な仕掛けはありません。
    links:
      - label: Open
        url: https://melodia.dttjp.com/
        kind: primary

  - title: LuminaFix
    icon: fa-solid fa-display
    desc: 画面焼けや不調などが治るかもしれないやつです　CSSとJSで生成するため、動画のものよりも色が正しいはず
    tech: [HTML, CSS, JavaScript]
    background: HTML・CSS・JavaScript で作っています。色は CSS と JavaScript で生成しています。
    links:
      - label: Open
        url: https://luminafix.dttjp.com/
        kind: primary

  - title: Padly
    icon: fa-solid fa-tablet-screen-button
    desc: MDMで管理されているiPad　次いつ更新できるかわからない？このサイトならすぐにわかります
    tech: [HTML, CSS, JavaScript, JSON, GitHub Actions]
    background: GitHub Actions で JSON ファイルを書き換え、その JSON をブラウザ側が読み取って表示する仕組みです。
    links:
      - label: Open
        url: https://padly.dttjp.com/
        kind: primary

  - title: PGlearn
    icon: fa-solid fa-terminal
    desc: コード実行環境がなくて学習できない？ここなら簡単なコードが実行できます
    tech: [HTML, CSS, JavaScript]
    background: HTML・CSS・JavaScript で作っています。外部ライブラリを多く読み込んでいますが、動作はブラウザの中だけで完結します。
    links:
      - label: Open
        url: https://pglearn.dttjp.com/
        kind: primary

  - title: MadoBakoCode
    icon: fa-solid fa-code
    desc: HTML・CSS・JavaScript のコードをブラウザ上で実行できる環境です。各種ファイルにも対応しています
    tech: [Vite, Service Worker, HTML, CSS, JavaScript]
    background: Service Worker を使用し、ブラウザ内でサーバーを立てることでサーバーを立てるのと同等の実行環境を作成しています。
    links:
      - label: Open
        url: https://mbc.dttjp.com/
        kind: primary
      - label: GitHub
        url: https://github.com/DTT-JP/madobakocode
        kind: secondary
        icon: fa-brands fa-github

