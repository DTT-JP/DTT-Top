# ============================================================
#  サイト全体の設定（名前・ナビ・共通の自己紹介・各モードの一言）
#  編集したら  npm run build  で HTML を作り直してください。
# ============================================================

site:
  name: DTTJP            # ロゴの左側
  tld: .com              # ロゴの右側（色が変わる部分）
  title: DTT - Portfolio # トップページの <title>
  description: 高校生 DTT のポートフォリオ。制作物・使える技術・使っているデバイス・SNS をまとめています。
  copyright_year: 2026
  updated: "2026-10-12"  # 最終更新日（レトロ版に表示）。サイトを更新したら書き換える
  favicon: favicon.png

# ---------- 自己紹介（3つのモードで共通） ----------
profile:
  name: DTT
  subtitle: High School Student & Otaku
  intro: プログラミングやガジェットが好きな高校生です。
  about:
    - 日本の現役高校生で、テクノロジーとオタク文化をこよなく愛しています。
    - Web サービスやツールを作って公開したり、自宅サーバーやクラウド上で動かしたりしています。

# ---------- トップ（About）ページ内のセクション見出し ----------
sections:
  about:
    title: About
    ja: 自己紹介
  skills:
    title: Tech Stack
    ja: 使える技術
    lead: 普段使っている言語・インフラ・ツール・アプリです。
  links:
    title: Links
    ja: SNS・アカウント

# ---------- ナビゲーション（= ページ一覧） ----------
#  label     : 通常版のメニュー名
#  label_ja  : レトロ版・ヴィンテージ版の日本語名
#  title     : 通常版のページ見出し
#  heading_ja: レトロ版・ヴィンテージ版のページ見出し
#  icon      : Font Awesome のクラス名
nav:
  - id: index
    file: index.html
    label: About
    label_ja: 自己紹介
    title: About
    heading_ja: 自己紹介
    icon: fa-solid fa-user
  - id: works
    file: works.html
    label: Works
    label_ja: 制作物
    title: Works
    heading_ja: 制作物
    icon: fa-solid fa-cubes
    lead: これまでに作ったものの一覧です。
  - id: devices
    file: devices.html
    label: Devices
    label_ja: デバイス
    title: My Devices
    heading_ja: デバイス・スペック一覧
    icon: fa-solid fa-microchip
    lead: 普段使っている PC、サーバー、ガジェットと、その用途です。

# ---------- 旧URLからの転送（古いリンクが 404 にならないように） ----------
#  「旧ファイル名: 転送先」。全モードに転送ページを作ります。不要になったら消してOK。
redirects:
  projects.html: works.html
  services.html: works.html
  links.html: index.html#links

# ---------- 表示モード ----------
#  dir が空ならサイト直下、s なら /s/、ss なら /ss/ に出力されます。
#  message … そのモードならではの一言だけをここに書く（自己紹介は上の profile で共通）
modes:
  - id: modern
    dir: ""
    label: Modern
    period: 2014-2026+
    label_ja: 現代版 (2026)
    message: ページ下の Display Mode から、昔のホームページ風の表示にも切り替えられます。
  - id: retro
    dir: s
    label: Retro
    period: 2000年前後
    label_ja: レトロ版 (2000年前後)
    message: このページは、2000年前後の個人ホームページを再現したレトロ版です。
    marquee: ★ DTTJP.com へようこそ！ ★ ご来訪ありがとうございます ★
  - id: vintage
    dir: ss
    label: Vintage
    period: Pre-IE4
    label_ja: ヴィンテージ版 (Pre-IE4)
    message: このページは、CSS を使わない極めて古いブラウザ向けのヴィンテージ版です。
    welcome: 個人ホームページへようこそ
